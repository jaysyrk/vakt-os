[package]
name = "zrpkg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
ed25519-dalek = "3.0.0"
flate2 = "1.1.9"
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }

# Overflow is a wrong answer, not a fast one. Release builds default
# to wrapping silently; this project has already had one integer
# underflow bug (vakt-compositor, see docs/SECURITY_AUDIT.md) that
# produced a bad value rather than a crash. The cost is negligible for
# these workloads.
[profile.release]
overflow-checks = true

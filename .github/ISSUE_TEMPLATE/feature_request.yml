name: Feature request
description: Propose something this project doesn't do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth a skim first: [ROADMAP.md](../../ROADMAP.md) lists what's
        already planned, including the open items under "Production
        Readiness" — your idea might already be tracked there.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What you're trying to do that the project doesn't support today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: >
        How you'd expect this to work. If it touches the security model
        (read-only root, signing, Landlock, the panel's PIN gate), say so —
        CONTRIBUTING.md asks changes like that to state their reasoning
        plainly.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, and why this one's better, if relevant.

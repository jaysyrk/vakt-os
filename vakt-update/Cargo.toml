[package]
name = "vakt-update"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
flate2 = "1.1.9"
tokio = { version = "1.53.1", features = ["full"] }

[dependencies.zrpkg]
path = "../pkg-manager"

# Overflow is a wrong answer, not a fast one. Release builds default
# to wrapping silently; this project has already had one integer
# underflow bug (vakt-compositor, see docs/SECURITY_AUDIT.md) that
# produced a bad value rather than a crash. The cost is negligible for
# these workloads.
[profile.release]
overflow-checks = true
